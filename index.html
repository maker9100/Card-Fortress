<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1510">
  <title>CARD FORTRESS ONLINE</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>♠️ CARD FORTRESS</h1>
      <p>ONLINE · One Card MVP</p>
      <div id="connectionBadge" class="badge">연결 준비 중…</div>
    </header>

    <section id="homeScreen" class="panel screen active">
      <h2>온라인 멀티</h2>
      <p class="muted">친구들이 각자 자기 폰으로 같은 방에 접속합니다.</p>

      <label class="field">
        <span>닉네임</span>
        <input id="nicknameInput" maxlength="12" placeholder="예: 플레이어1">
      </label>

      <div class="controls">
        <button id="createRoomBtn">🏠 방 만들기</button>
      </div>

      <div class="divider"><span>또는</span></div>

      <label class="field">
        <span>방 코드</span>
        <input id="roomCodeInput" maxlength="6" autocapitalize="characters" placeholder="ABC123">
      </label>
      <button id="joinRoomBtn" class="secondary">🚪 방 참가</button>

      <div id="setupError" class="error"></div>

      <div class="controls">
        <a class="buttonLike ghost" href="./local.html">📱 기존 로컬 모드 열기</a>
      </div>
    </section>

    <section id="lobbyScreen" class="panel screen">
      <div class="roomHeader">
        <div>
          <div class="muted">방 코드</div>
          <div id="roomCodeLabel" class="roomCode">------</div>
        </div>
        <button id="copyRoomBtn" class="tiny">복사</button>
      </div>

      <h2>대기실</h2>
      <div id="playerList" class="playerList"></div>

      <div class="rulebox">
        <b>⚡ 온라인 원카드</b><br>
        2~4명이 모두 준비하면 호스트가 시작할 수 있습니다.
      </div>

      <div class="controls">
        <button id="readyBtn">✅ 준비</button>
        <button id="startOnlineBtn" style="display:none">▶ 게임 시작</button>
        <button id="leaveRoomBtn" class="danger">방 나가기</button>
      </div>
    </section>

    <section id="gameScreen" class="panel screen">
      <div class="gameTop">
        <div>
          <div id="turnLabel" class="badge">턴</div>
          <div id="gameRoomLabel" class="muted"></div>
        </div>
        <button id="leaveGameBtn" class="tiny danger">나가기</button>
      </div>

      <div id="opponents" class="opponents"></div>

      <div class="centerArea">
        <div>
          <div class="muted">현재 카드</div>
          <div id="topCard" class="singleCard"></div>
          <div id="chosenSuit" class="chosenSuit"></div>
        </div>
        <button id="drawBtn" class="deckBtn">🂠<small>뽑기</small></button>
      </div>

      <div id="attackInfo" class="attackInfo"></div>
      <div id="message" class="message"></div>

      <div class="handHeader">
        <span>내 패</span>
        <strong id="myCardCount">0장</strong>
      </div>
      <div id="myHand" class="hand"></div>
    </section>

    <section id="suitScreen" class="panel screen">
      <div class="badge">7 효과</div>
      <h2>다음 무늬 선택</h2>
      <div class="suitGrid">
        <button data-suit="♠" class="suitBtn">♠<span>스페이드</span></button>
        <button data-suit="♥" class="suitBtn red">♥<span>하트</span></button>
        <button data-suit="♦" class="suitBtn red">♦<span>다이아</span></button>
        <button data-suit="♣" class="suitBtn">♣<span>클로버</span></button>
      </div>
    </section>

    <section id="resultScreen" class="panel screen">
      <div class="badge">게임 종료</div>
      <h2 id="winnerLabel">🏆 승리!</h2>
      <div id="resultPlayers" class="playerList"></div>
      <div class="controls">
        <button id="backLobbyBtn">대기실로</button>
        <button id="resultLeaveBtn" class="secondary">메인으로</button>
      </div>
    </section>
  </main>

  <script type="module" src="./online.js"></script>
</body>
</html>
