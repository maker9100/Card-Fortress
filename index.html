<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08110d">
<title>CARD FORTRESS ONLINE</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="app">
  <header class="brand">
    <div class="logo">♠</div>
    <div><h1>CARD FORTRESS</h1><p>ONLINE</p></div>
    <div id="connectionBadge" class="dot">●</div>
  </header>

  <section id="homeScreen" class="screen active panel">
    <h2>온라인 플레이</h2>
    <p class="muted">친구들과 각자 자기 기기에서 접속합니다.</p>
    <label class="field"><span>닉네임</span><input id="nicknameInput" maxlength="12" placeholder="닉네임"></label>
    <button id="createRoomBtn" class="primary">방 만들기</button>
    <div class="divider">또는</div>
    <label class="field"><span>방 코드</span><input id="roomCodeInput" maxlength="6" placeholder="ABC123"></label>
    <button id="joinRoomBtn" class="secondary">방 참가</button>
    <div id="setupError" class="error"></div>
    <a class="linkbtn" href="./local.html">📱 로컬 플레이</a>
  </section>

  <section id="lobbyScreen" class="screen panel">
    <div class="row">
      <div><div class="muted">방 코드</div><div id="roomCodeLabel" class="roomcode">------</div></div>
      <button id="copyRoomBtn" class="tiny">복사</button>
    </div>

    <h2>대기실</h2>
    <div id="playerList" class="list"></div>

    <div class="modebox">
      <div class="muted">온라인 게임 모드</div>
      <div class="modegrid">
        <button class="modebtn selected" data-mode="onecard">⚡ 원카드</button>
        <button class="modebtn" data-mode="poker">♠ 포커</button>
        <button class="modebtn" data-mode="doubt">🎭 다우트</button>
      </div>
      <div id="modeHelp" class="muted"></div>
    </div>

    <div class="controls">
      <button id="readyBtn" class="secondary">준비</button>
      <button id="startOnlineBtn" class="primary" style="display:none">게임 시작</button>
      <button id="leaveRoomBtn" class="danger">방 나가기</button>
    </div>
  </section>

  <!-- ONE CARD -->
  <section id="onecardScreen" class="screen">
    <div class="gamehead">
      <div><div id="ocTurnLabel" class="pill"></div><div id="gameRoomLabel" class="muted"></div></div>
      <button class="tiny dangerText" id="leaveGameBtn">나가기</button>
    </div>
    <div id="ocOpponents" class="opponents"></div>
    <div class="table">
      <div><div class="muted">현재 카드</div><div id="ocTopCard" class="single"></div><div id="ocChosenSuit" class="chosen"></div></div>
      <button id="ocDrawBtn" class="deck">🂠<small>뽑기</small></button>
    </div>
    <div id="ocAttackInfo" class="attack"></div>
    <div id="ocMessage" class="msg"></div>
    <div class="handbox"><div class="row"><span>내 패</span><strong id="ocMyCount"></strong></div><div id="ocHand" class="hand"></div></div>
  </section>

  <section id="suitScreen" class="screen panel center">
    <h2>7 효과 · 무늬 선택</h2>
    <div class="suitgrid">
      <button class="suitBtn" data-suit="♠">♠</button><button class="suitBtn red" data-suit="♥">♥</button>
      <button class="suitBtn red" data-suit="♦">♦</button><button class="suitBtn" data-suit="♣">♣</button>
    </div>
  </section>

  <!-- POKER -->
  <section id="pokerScreen" class="screen">
    <div class="gamehead">
      <div><div id="pokerPhase" class="pill">포커</div><div id="pokerInfo" class="muted"></div></div>
      <button class="tiny dangerText" id="pokerLeaveBtn">나가기</button>
    </div>
    <div id="pokerPlayers" class="list"></div>
    <div class="panel gamepanel">
      <h2 id="pokerTitle">포커</h2>
      <div id="pokerMessage" class="msg"></div>
      <div id="pokerCards" class="hand centerhand"></div>
      <div id="pokerActions" class="controls"></div>
    </div>
  </section>

  <!-- DOUBT -->
  <section id="doubtScreen" class="screen">
    <div class="gamehead">
      <div><div id="doubtTurn" class="pill"></div><div id="doubtRoom" class="muted"></div></div>
      <button class="tiny dangerText" id="doubtLeaveBtn">나가기</button>
    </div>
    <div id="doubtPlayers" class="list"></div>
    <div class="panel gamepanel">
      <h2>🎭 다우트</h2>
      <div id="doubtCenter" class="doubtcenter"></div>
      <div id="doubtMessage" class="msg"></div>
      <div id="doubtControls"></div>
      <div class="handbox"><div class="row"><span>내 패</span><strong id="doubtCount"></strong></div><div id="doubtHand" class="hand"></div></div>
    </div>
  </section>

  <section id="resultScreen" class="screen panel center">
    <div class="crown">♛</div>
    <h2 id="winnerLabel">승리!</h2>
    <div id="resultPlayers" class="list"></div>
    <div class="controls">
      <button id="backLobbyBtn" class="primary">대기실로</button>
      <button id="resultLeaveBtn" class="secondary">메인으로</button>
    </div>
  </section>
</main>
<script type="module" src="./online.js"></script>
</body>
</html>
